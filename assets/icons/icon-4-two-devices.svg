<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- 双设备 + 数据线：电脑与手机之间一根线，直指 ADB 连接两端 -->
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0ea5e9"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg4)"/>

  <!-- 电脑（左） -->
  <rect x="88" y="150" width="150" height="100" rx="12" fill="#ffffff"/>
  <rect x="72" y="258" width="182" height="14" rx="7" fill="#dbeafe"/>

  <!-- 手机（右） -->
  <rect x="330" y="130" width="104" height="190" rx="20" fill="#ffffff"/>
  <rect x="366" y="146" width="32" height="8" rx="4" fill="#93c5fd"/>

  <!-- 连接线（数据流） -->
  <g stroke="#fef08a" stroke-width="18" stroke-linecap="round" fill="none">
    <path d="M262 350 h96"/>
    <path d="M330 322 l30 28 -30 28" fill="#fef08a"/>
  </g>
  <circle cx="254" cy="350" r="14" fill="#fef08a"/>
</svg>
